<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESEP: сталь или алюминий</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@300;400;500;700&display=swap">
<style>
/* Layout: тёмно-синий герой с объёмным 3D-орнаментом «қошқар мүйіз», дальше светлые «пластилиновые» карточки.
   Толстый Unbounded для заголовков и цифр, тонкий Onest 300 для текста. Цвета: небесно-голубой, тёмно-синий, жёлтый. */
:root{
  --sky:#38b6f0; --sky-2:#8fd8fb; --navy:#0b1f4d; --navy-2:#163a86; --sun:#ffc629; --sun-2:#e09a00;
  --bg:#eaf4fb; --card:#ffffff; --ink:#0b1f4d; --soft:#4d6286; --line:#d4e3f1; --steel:#8793a6;
  --good:#16935a; --warn:#c77b00; --bad:#cf3b31;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --text:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --clay:inset 0 2px 0 rgba(255,255,255,.9),inset 0 -3px 0 rgba(11,31,77,.06),0 24px 48px -26px rgba(11,31,77,.45),0 3px 8px rgba(11,31,77,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#061433; --card:#0e2552; --ink:#eaf4ff; --soft:#a9bddb; --line:#1d3a70; --steel:#a3afc2;
  --good:#45c98a; --warn:#f0b24a; --bad:#ff7466;
  --clay:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.25),0 24px 48px -26px rgba(0,0,0,.8),0 3px 8px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#061433; --card:#0e2552; --ink:#eaf4ff; --soft:#a9bddb; --line:#1d3a70; --steel:#a3afc2;
  --good:#45c98a; --warn:#f0b24a; --bad:#ff7466;
  --clay:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -3px 0 rgba(0,0,0,.25),0 24px 48px -26px rgba(0,0,0,.8),0 3px 8px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-weight:300;font-size:17px;line-height:1.6}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
b,strong{font-weight:700}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}

/* NAV */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(11,31,77,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.02em}
.logo svg{width:38px;height:26px}
.links{display:flex;gap:4px;flex-wrap:wrap}
.links a{color:#cfe6ff;text-decoration:none;font-weight:500;font-size:15px;padding:6px 10px;border-radius:999px}
.links a:hover{background:rgba(255,255,255,.1);color:#fff}
@media (max-width:860px){.links{display:none}}
.lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;gap:2px}
.lang button{font:inherit;font-family:var(--display);font-weight:700;font-size:13px;border:0;border-radius:999px;padding:6px 12px;background:transparent;color:#cfe6ff;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--sun);color:var(--navy);box-shadow:inset 0 -2px 0 var(--sun-2)}

/* HERO */
.hero{background:radial-gradient(120% 90% at 85% 30%,#1d4fae 0%,var(--navy) 55%,#071433 100%);color:#fff;border-radius:0 0 40px 40px;overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center;padding-block:40px 48px}
@media (max-width:900px){.hero .wrap{grid-template-columns:minmax(0,1fr);padding-block:24px 36px}}
.kicker{color:var(--sky-2);font-weight:400;font-size:15px}
.hero h1{font-weight:900;font-size:clamp(34px,5.4vw,66px);line-height:1.02;margin-top:14px;letter-spacing:-.01em}
.hero .sub{margin-top:18px;font-size:clamp(17px,1.6vw,20px);font-weight:300;color:#d6e8ff;max-width:52ch}
.esep{margin-top:14px;font-size:14px;color:var(--sky-2)}
.esep b{font-family:var(--display);color:var(--sun)}
.cta{display:inline-flex;margin-top:24px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--navy);text-decoration:none;background:linear-gradient(180deg,#ffd75a,var(--sun));padding:14px 22px;border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--sun-2),0 18px 30px -12px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}
.cta:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 2px 0 var(--sun-2),0 8px 16px -10px rgba(0,0,0,.5)}
.orn3d{position:relative;aspect-ratio:1/1;max-width:540px;width:100%;justify-self:center}
.orn3d canvas,.orn3d svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:900px){.orn3d{max-width:300px;order:-1}}
.claims{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:8px}
@media (max-width:640px){.claims{grid-template-columns:minmax(0,1fr)}}
.claim{border-radius:22px;padding:18px 20px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 40px -24px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px}
.claim .n{font-family:var(--display);font-weight:900;font-size:clamp(28px,3.4vw,40px);line-height:1;white-space:nowrap}
.claim .t{font-size:14px;color:#cfe2ff;line-height:1.4}
.claim.c1 .n{color:#c9d6ea} .claim.c2 .n{color:var(--sky-2)} .claim.c3 .n{color:var(--sun)}

/* SECTIONS */
main{display:flex;flex-direction:column;gap:88px;padding-block:72px 40px}
section{scroll-margin-top:80px}
.sh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;margin-bottom:30px}
.num{font-family:var(--display);font-weight:900;font-size:clamp(56px,8vw,96px);line-height:.9;color:var(--sky);
  text-shadow:1px 1px 0 var(--navy-2),2px 2px 0 var(--navy-2),3px 3px 0 var(--navy-2),4px 4px 0 var(--navy-2),5px 5px 0 var(--navy-2),6px 6px 0 var(--navy-2),8px 14px 22px rgba(11,31,77,.35)}
.sh .lbl{font-family:var(--display);font-weight:700;font-size:14px;color:var(--sun-2)}
.sh h2{font-weight:900;font-size:clamp(26px,3.6vw,44px);margin-top:4px}
.sh p{color:var(--soft);margin-top:8px;max-width:64ch}
@media (max-width:560px){.sh{grid-template-columns:minmax(0,1fr);gap:8px}}
.card{background:var(--card);border-radius:26px;box-shadow:var(--clay);padding:22px;min-width:0}
.small{font-size:14px;color:var(--soft);line-height:1.45}
.divider{display:block;width:100%;height:44px;max-width:1200px;margin:0 auto}

/* 01 */
.trains{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:700px){.trains{grid-template-columns:minmax(0,1fr)}}
.tc{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.tc h3{font-weight:900;font-size:22px}
.tc.al h3{color:var(--sky)} .tc.st h3{color:var(--steel)}
.tc .mass{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--ink)}
.tc .mass span{font-size:22px;font-weight:500;color:var(--soft)}
.tc dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0}
.tc dt{color:var(--soft)} .tc dd{margin:0;font-weight:500}
.coach{width:100%;height:auto;display:block;margin-top:6px}
.conds{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.chip{background:var(--card);border-radius:999px;padding:8px 16px;box-shadow:var(--clay);font-size:15px;font-weight:400}
.chip b{font-family:var(--display);font-weight:700}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:980px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:500px){.parts{grid-template-columns:minmax(0,1fr)}}
.part{display:flex;flex-direction:column;gap:14px}
.part h3{font-weight:700;font-size:16px;color:var(--sky)}
.r .v{font-family:var(--display);font-weight:700;font-size:clamp(19px,1.9vw,23px);line-height:1.15;font-variant-numeric:tabular-nums}
.r .l{font-size:14px;color:var(--soft);line-height:1.35}
.note{margin-top:14px}

/* 02 */
.prob{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.prob{grid-template-columns:minmax(0,1fr)}}
.prob h3{font-weight:700;font-size:17px;margin-bottom:8px}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg.chart text{font-family:var(--text);font-size:20px;fill:var(--soft)}
.reasons{display:flex;flex-direction:column;gap:16px}
.reason{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.reason svg{width:52px;height:52px}
.reason h3{font-weight:700;font-size:17px;margin-bottom:4px}
.reason p{color:var(--soft);font-size:16px}

/* 03 */
.sim{display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:960px){.sim{grid-template-columns:minmax(0,1fr)}}
.pult{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--soft)}
.f output{font-family:var(--display);font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
select,input[type=number]{width:100%;font:inherit;font-weight:500;font-size:15px;padding:10px 12px;border:0;border-radius:14px;background:var(--bg);color:var(--ink);box-shadow:inset 0 2px 5px rgba(11,31,77,.12)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:999px;background:var(--bg);box-shadow:inset 0 2px 4px rgba(11,31,77,.18);margin:6px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--sky-2) 25%,var(--sky) 60%,var(--navy-2) 100%);box-shadow:0 4px 8px rgba(11,31,77,.35);cursor:pointer;border:0}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,var(--sky-2) 25%,var(--sky) 60%,var(--navy-2) 100%);box-shadow:0 4px 8px rgba(11,31,77,.35);cursor:pointer;border:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sep{border:0;height:1px;background:var(--line);margin:4px 0}
.board{display:flex;flex-direction:column;gap:18px;min-width:0}
.verdict{display:flex;gap:18px;align-items:center;border-radius:26px;padding:20px 22px;color:#fff;background:linear-gradient(135deg,var(--v1),var(--v2));box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 24px 40px -22px var(--v2)}
.verdict .ic{flex:none;width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:28px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.verdict .big{font-family:var(--display);font-weight:900;font-size:clamp(20px,2.4vw,28px);line-height:1.15}
.verdict .why{opacity:.95;margin-top:4px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:16px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:14px;color:var(--soft)}
.kpi .v{font-family:var(--display);font-weight:900;font-size:clamp(18px,2.1vw,25px);white-space:nowrap}
.kpi .s{font-size:13px;color:var(--soft);line-height:1.3}
.runhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
.runhead h3,.board h3{font-weight:700;font-size:17px}
.btn{font-family:var(--display);font-weight:700;font-size:14px;color:var(--navy);border:0;cursor:pointer;background:linear-gradient(180deg,#ffd75a,var(--sun));padding:12px 18px;border-radius:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 var(--sun-2),0 14px 24px -12px rgba(11,31,77,.5);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--sun-2)}
.ctrs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0}
.ctr{border-radius:18px;padding:10px 14px;background:var(--bg);box-shadow:inset 0 2px 5px rgba(11,31,77,.1)}
.ctr .l{font-size:14px;color:var(--soft)}
.ctr .n{display:block;font-family:var(--display);font-weight:900;font-size:clamp(17px,2vw,22px);font-variant-numeric:tabular-nums}
.ctr.st .n{color:var(--steel)} .ctr.al .n{color:var(--sky)}
.legend{display:flex;flex-wrap:wrap;gap:18px;font-size:14px;color:var(--soft);margin-top:6px}
.legend i{display:inline-block;width:18px;height:6px;border-radius:3px;vertical-align:middle;margin-right:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:400;color:var(--soft);font-size:13px}
td{font-weight:500;font-variant-numeric:tabular-nums}
tr.cur td{background:rgba(255,198,41,.18)}
.pill{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#fff}
.p-good{background:var(--good)} .p-warn{background:var(--warn)} .p-bad{background:var(--bad)}

/* 04 */
.kz{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:800px){.kz{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:4px}
.col .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.col .hd h3{font-weight:900;font-size:22px}
.col .badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:22px;background:var(--c);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.18)}
.fact{padding-block:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.fact b{font-weight:700;font-size:17px}
.fact span{color:var(--soft);font-size:16px}
.fact a{font-size:13px;color:var(--sky);font-weight:500}

/* 05 */
.final{background:radial-gradient(120% 120% at 10% 0%,#1d4fae,var(--navy) 60%);color:#fff;border-radius:34px;padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;gap:24px;box-shadow:0 40px 60px -36px rgba(11,31,77,.8);position:relative;overflow:hidden}
.final h2{font-weight:900;font-size:clamp(26px,3.6vw,44px);max-width:22ch}
.final p{max-width:68ch;color:#d6e8ff;font-size:18px}
.recs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){.recs{grid-template-columns:minmax(0,1fr)}}
.rec{border-radius:22px;padding:18px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.rec .k{font-family:var(--display);font-weight:900;font-size:30px;color:var(--sun);line-height:1}
.rec h3{font-weight:700;font-size:17px;margin:10px 0 6px}
.rec p{font-size:16px}
.ask{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.ask{grid-template-columns:minmax(0,1fr)}}
.ask h3{font-weight:700;font-size:17px;color:var(--sky-2)}
.ask ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;color:#d6e8ff}
footer{padding-block:24px 48px;color:var(--soft);font-size:14px}
footer .wrap{display:flex;flex-direction:column;gap:8px;max-width:1200px}
footer a{color:var(--sky)}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}.cta,.btn{transition:none}}
</style>
<style>[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>


<!-- общие SVG: градиенты и объёмный орнамент -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#a8e4ff"/><stop offset=".45" style="stop-color:#38b6f0"/><stop offset="1" style="stop-color:#163a86"/></linearGradient>
    <linearGradient id="gSun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff1a8"/><stop offset=".45" style="stop-color:#ffc629"/><stop offset="1" style="stop-color:#b97400"/></linearGradient>
    <linearGradient id="gAlu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#ffffff"/><stop offset=".35" style="stop-color:#eef4fa"/><stop offset=".7" style="stop-color:#c9d6e4"/><stop offset="1" style="stop-color:#9fb0c4"/></linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#c4ccd7"/><stop offset=".5" style="stop-color:#8d98a8"/><stop offset="1" style="stop-color:#5d6878"/></linearGradient>
    <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#2a5bb8"/><stop offset="1" style="stop-color:#0b1f4d"/></linearGradient>
    <radialGradient id="gWheel" cx=".35" cy=".35" r=".7"><stop offset="0" style="stop-color:#6b7b95"/><stop offset="1" style="stop-color:#0b1f4d"/></radialGradient>
  </defs>
  <symbol id="hornPath" viewBox="0 0 100 64"><path d="M50 60 V36 C50 18 35 7 22 13 C9 19 11 37 24 37 C33 37 35 26 27 24 M50 36 C50 18 65 7 78 13 C91 19 89 37 76 37 C67 37 65 26 73 24"/></symbol>
  <symbol id="horn" viewBox="0 0 100 64" overflow="visible">
    <use href="#hornPath" style="fill:none;stroke:rgba(11,31,77,.35);stroke-width:9;stroke-linecap:round;stroke-linejoin:round" transform="translate(1.5 3)"/>
    <use href="#hornPath" style="fill:none;stroke:url(#gSky);stroke-width:8;stroke-linecap:round;stroke-linejoin:round"/>
    <use href="#hornPath" style="fill:none;stroke:rgba(255,255,255,.75);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" transform="translate(-1.2 -1.8)"/>
  </symbol>
  <symbol id="hornGold" viewBox="0 0 100 64" overflow="visible">
    <use href="#hornPath" style="fill:none;stroke:rgba(11,31,77,.35);stroke-width:9;stroke-linecap:round;stroke-linejoin:round" transform="translate(1.5 3)"/>
    <use href="#hornPath" style="fill:none;stroke:url(#gSun);stroke-width:8;stroke-linecap:round;stroke-linejoin:round"/>
    <use href="#hornPath" style="fill:none;stroke:rgba(255,255,255,.8);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" transform="translate(-1.2 -1.8)"/>
  </symbol>
  <symbol id="gem" viewBox="0 0 60 60" overflow="visible">
    <path d="M30 6 L54 30 L30 54 L6 30 Z" style="fill:rgba(11,31,77,.3)" transform="translate(2 4)"/>
    <path d="M30 6 L54 30 L30 54 L6 30 Z" style="fill:url(#gSun)"/>
    <path d="M30 17 C37 17 40 23 35 30 C40 37 37 43 30 43 C23 43 20 37 25 30 C20 23 23 17 30 17 Z" style="fill:url(#gSky);stroke:#fff;stroke-width:1.5;stroke-opacity:.7"/>
    <path d="M17 26 L30 13 L36 19" style="fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-opacity:.8"/>
  </symbol>
</svg>

/* ---------- физика ---------- */
const C={ROT:1.08,A:0.8,B:0.8,P:2.6e6,CDA:10,ROLL:12,ROLLV:0.1,ETA:0.85,DT:0.5},M_AL=145,M_ST=180;
const PRESETS={case:{len:90,stops:15,vmax:140,temp:20,regen:60,tariff:140,akm:245000},mid:{len:350,stops:5,vmax:120,temp:-10,regen:30,tariff:35,akm:245000},long:{len:1000,stops:8,vmax:120,temp:-20,regen:30,tariff:35,akm:245000}};
const rhoAt=T=>101325/(287.05*(T+273.15));
const resist=(mt,v,rho)=>mt*(C.ROLL+C.ROLLV*v*3.6)+0.5*rho*C.CDA*v*v;
function segment(mt,dist,vmax,regen,rho){
  const m=mt*1000*C.ROT;let v=0,x=0,eIn=0,eBack=0,br=false,k=0,g=0;const cum=[[0,0]],prof=[[0,0]];
  while(x<dist&&g++<2e6){
    if(!br&&dist-x<=v*v/(2*C.B))br=true;
    const r=resist(mt,v,rho);
    if(br){const fb=m*C.B-r;if(fb>0)eBack+=fb*v*C.DT*regen;v=Math.max(v-C.B*C.DT,0);if(v===0)break;}
    else{const f=v<vmax?Math.min(m*C.A+r,C.P/Math.max(v,0.1)):r;const a=(f-r)/m;eIn+=f*v*C.DT/C.ETA;v=Math.min(v+a*C.DT,vmax);}
    x+=v*C.DT;if(++k%4===0){cum.push([x,eIn-eBack]);prof.push([x,v]);}
  }
  cum.push([dist,eIn-eBack]);prof.push([dist,0]);return{e:eIn-eBack,cum,prof};
}
function interp(a,x){if(x<=a[0][0])return a[0][1];let lo=0,hi=a.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(a[m][0]<=x)lo=m;else hi=m;}const[x0,y0]=a[lo],[x1,y1]=a[hi];return x1===x0?y1:y0+(y1-y0)*(x-x0)/(x1-x0);}
function perKm(mt,p){const n=Math.round(p.stops),seg=p.len*1000/(n+1);return segment(mt,seg,p.vmax/3.6,p.regen/100,rhoAt(p.temp)).e*(n+1)/3.6e6/p.len;}
const annualSave=p=>(perKm(M_ST,p)-perKm(M_AL,p))*p.akm/1000;

function ornament(){

  const fallback=()=>{box.innerHTML='<svg viewBox="-10 -10 120 84"><use href="#horn" width="100" height="64"/></svg>';};
  if(typeof THREE==='undefined'){fallback();return;}
  let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(e){fallback();return;}

  const warm=new THREE.PointLight(0xffc629,2.2,30);warm.position.set(5,-3,5);scene.add(warm);
  const rim=new THREE.PointLight(0x38b6f0,2.5,30);rim.position.set(-3,2,-6);scene.add(rim);
  const blue=new THREE.MeshPhysicalMaterial({color:0x0f7fe0,metalness:0.3,roughness:0.16,clearcoat:1,clearcoatRoughness:0.08});
  const gold=new THREE.MeshPhysicalMaterial({color:0xffbf1f,metalness:0.85,roughness:0.25,clearcoat:0.6});
  const g=new THREE.Group();scene.add(g);
  const R=[[0,-1.9],[0,-1.0],[0.06,-0.15],[0.32,0.6],[0.82,1.06],[1.38,1.0],[1.7,0.55],[1.66,-0.02],[1.34,-0.32],[0.97,-0.22],[0.86,0.14],[1.07,0.38],[1.3,0.26]];
  const tube=(pts,sx,sy,oy,rad,mat)=>{
    const v=pts.map((p,i)=>new THREE.Vector3(p[0]*sx,p[1]*sy+oy,0.18*Math.sin(i*0.7)));
    const curve=new THREE.CatmullRomCurve3(v,false,'centripetal');
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve,220,rad,28,false),mat));
    [v[0],v[v.length-1]].forEach(p=>{const s=new THREE.Mesh(new THREE.SphereGeometry(rad,28,20),mat);s.position.copy(p);g.add(s);});
  };
  tube(R,1,1,0.35,0.2,blue);tube(R,-1,1,0.35,0.2,blue);
  const r2=R.slice(2);tube(r2,0.55,-0.55,-1.45,0.13,blue);tube(r2,-0.55,-0.55,-1.45,0.13,blue);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3.15,0.07,24,160),gold);ring.position.z=-0.6;g.add(ring);
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,d=new THREE.Mesh(new THREE.OctahedronGeometry(0.16,0),gold);d.position.set(Math.cos(a)*3.15,Math.sin(a)*3.15,-0.6);g.add(d);}
  const resize=()=>{const w=box.clientWidth,h=box.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};
  resize();window.addEventListener('resize',resize);
  let mx=0,my=0;box.parentElement.addEventListener('pointermove',e=>{const r=box.getBoundingClientRect();mx=((e.clientX-r.left)/r.width-.5);my=((e.clientY-r.top)/r.height-.5);});
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let vis=true;
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{vis=es[0].isIntersecting;}).observe(box);
  const t0=performance.now();
  const loop=now=>{const t=(now-t0)/1000;
    g.rotation.y=Math.sin(t*0.45)*0.55+mx*0.6;g.rotation.x=-0.08+my*0.35;g.position.y=Math.sin(t*0.9)*0.08;
    ring.rotation.z=t*0.15;renderer.render(scene,cam);if(!still)requestAnimationFrame(f);};
  const f=now=>{if(vis)loop(now);else requestAnimationFrame(f);};
  if(still){g.rotation.y=0.35;renderer.render(scene,cam);}else requestAnimationFrame(f);
}

  el('path',{d,style:`fill:none;stroke:${tok('--sky')};stroke-width:7;stroke-linejoin:round;stroke-linecap:round`},s);
  el('path',{d,style:'fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-linejoin:round',transform:'translate(-1 -2)'},s);
  const mark=(km,txt,c)=>{const v=interpLog(sp,vals,km);el('line',{x1:x(km),y1:y(v),x2:x(km),y2:By,style:`stroke:${c};stroke-width:2.5;stroke-dasharray:4 5`},s);
    el('use',{href:'#gem',x:x(km)-20,y:y(v)-20,width:40,height:40},s);
    el('text',{x:x(km)+(km>50?-26:26),y:y(v)-26,'text-anchor':km>50?'end':'start',style:`fill:${c};font-weight:700;font-size:22px`},s,txt+' ≈ '+nf(v));};
  mark(5.6,tr('ch.case'),tok('--steel'));mark(111,tr('ch.ktz'),tok('--sun-2'));
}

/* ---------- симулятор ---------- */
const ids=['len','stops','vmax','temp','regen','tariff','akm','prem','rate','years','esc','disc'];
const read=()=>{const o={};ids.forEach(i=>o[i]=parseFloat($(i).value)||0);return o;};
const setVals=p=>Object.entries(p).forEach(([k,v])=>$(k).value=v);
let S=null;
function compute(){
  const p=read(),Lk=p.len,n=Math.round(p.stops),seg=Lk*1000/(n+1),rho=rhoAt(p.temp);
  const a=segment(M_AL,seg,p.vmax/3.6,p.regen/100,rho),s=segment(M_ST,seg,p.vmax/3.6,p.regen/100,rho);
  const kA=a.e*(n+1)/3.6e6/Lk,kS=s.e*(n+1)/3.6e6/Lk,mwh=(kS-kA)*p.akm/1000,save=mwh*1000*p.tariff,prem=p.prem*p.rate;
  const g=p.esc/100,r=p.disc/100,Y=Math.round(p.years);let cum=-prem,dcum=-prem,pay=null,dpay=null;const rows=[[0,cum,dcum]];
  for(let t=1;t<=Y;t++){const st=save*Math.pow(1+g,t-1),dt=st/Math.pow(1+r,t),pc=cum,pd=dcum;cum+=st;dcum+=dt;
    if(pay===null&&cum>=0)pay=t-1+(-pc)/st;if(dpay===null&&dcum>=0)dpay=t-1+(-pd)/dt;rows.push([t,cum,dcum]);}
  S={p,L:Lk,n,seg,a,s,kA,kS,mwh,save,prem,pay,dpay,cum,dcum,rows,Y};render();
}
const fy=y=>y===null?D().dash:(y<1?nf(y*12,0)+' '+U().mo:nf(y,1)+' '+U().yr);
function render(){
  const p=S.p,u=U(),d=D();
  $('lenO').textContent=nf(p.len)+' '+u.km;$('stopsO').textContent=Math.round(p.stops)+', '+d.every+' '+nf(S.seg/1000,S.seg<10000?1:0)+' '+u.km;
  $('vmaxO').textContent=p.vmax+' '+u.kmh;$('tempO').textContent=(p.temp>0?'+':'')+p.temp+' °C';$('regenO').textContent=p.regen+' %';
  $('tariffO').textContent=p.tariff+' '+u.tkwh;$('akmO').textContent=nf(p.akm)+' '+u.km;$('yearsO').textContent=Math.round(p.years)+' '+u.yr;
  $('escO').textContent=nf(p.esc,1)+' %';$('discO').textContent=nf(p.disc,1)+' %';
  $('kMwh').textContent=nf(S.mwh)+' '+u.mwh;$('kMwhS').textContent=nf(100*(S.kS-S.kA)/S.kS,1)+' '+d.pctSteel;
  $('kMoney').textContent=nf(S.save/1e6,1)+' '+u.mln;$('kMoneyS').textContent=d.prem+' '+nf(S.prem/1e6,1)+' '+u.mln;
  $('kPay').textContent=S.pay===null?d.no:fy(S.pay);$('kPayS').textContent=d.disc+': '+(S.dpay===null?d.nodisc:fy(S.dpay));
  $('kNpv').textContent=(S.dcum>=0?'+':'')+nf(S.dcum/1e6,0)+' '+u.mln;$('kNpvS').textContent=d.disc+'; '+d.und+' '+nf(S.cum/1e6,0);
  const v=$('verdict');
  if(S.dpay!==null&&S.dpay<=S.Y){v.style.setProperty('--v1','#2fc07b');v.style.setProperty('--v2','#0f7a48');$('vIc').textContent='✓';$('vBig').textContent=d.good+fy(S.dpay);$('vWhy').textContent=d.goodW;}
  else if(S.pay!==null&&S.pay<=S.Y){v.style.setProperty('--v1','#ffc629');v.style.setProperty('--v2','#c77b00');$('vIc').textContent='!';$('vBig').textContent=d.warn;$('vWhy').textContent=d.warnW(fy(S.pay),S.Y);}
  else{v.style.setProperty('--v1','#ff6b5e');v.style.setProperty('--v2','#b02a20');$('vIc').textContent='×';$('vBig').textContent=d.bad;$('vWhy').textContent=d.badW(S.Y);}
  drawRoute(0);drawProfile(-1);drawCum();drawSens();$('cA').textContent='0 '+u.kwh;$('cS').textContent='0 '+u.kwh;
}
function drawRoute(pr){
  const s=$('route');s.innerHTML='';const x0=34,x1=966,y=58,N=S.n+2;
  el('line',{x1:x0,y1:y+4,x2:x1,y2:y+4,style:'stroke:rgba(11,31,77,.25);stroke-width:12;stroke-linecap:round'},s);
  el('line',{x1:x0,y1:y,x2:x1,y2:y,style:`stroke:${tok('--navy-2')};stroke-width:10;stroke-linecap:round`},s);
  el('line',{x1:x0,y1:y-2,x2:x1,y2:y-2,style:'stroke:#fff;stroke-opacity:.35;stroke-width:2;stroke-linecap:round'},s);
  for(let i=0;i<N;i++){const x=x0+(x1-x0)*i/(N-1),r=(i===0||i===N-1)?19:12;el('use',{href:'#gem',x:x-r,y:y-r,width:2*r,height:2*r},s);}
  el('text',{x:x0,y:y+58,'text-anchor':'start'},s,D().km0);el('text',{x:x1,y:y+58,'text-anchor':'end'},s,nf(S.L)+' '+U().km);
  el('text',{x:500,y:y+58,'text-anchor':'middle'},s,S.n+' '+D().stops);
  const px=x0+(x1-x0)*pr;
  el('rect',{x:px-34,y:y-48,width:68,height:16,rx:8,style:'fill:url(#gSteel)'},s);
  el('rect',{x:px-34,y:y-30,width:68,height:16,rx:8,style:'fill:url(#gSky)'},s);
}
function drawProfile(xIn){
  const s=$('prof');s.innerHTML='';const Lx=64,Rx=980,Ty=12,By=180,seg=S.seg,vm=S.p.vmax/3.6;
  const sx=x=>Lx+(Rx-Lx)*x/seg,sy=v=>By-(By-Ty)*v/(vm*1.08);
  [0,Math.round(S.p.vmax/20)*10,S.p.vmax].forEach(t=>{const yy=sy(t/3.6);el('line',{x1:Lx,y1:yy,x2:Rx,y2:yy,style:`stroke:${tok('--line')};stroke-width:1.5`},s);el('text',{x:Lx-10,y:yy+7,'text-anchor':'end'},s,t);});
  el('text',{x:Lx,y:By+34,'text-anchor':'start'},s,'0');el('text',{x:Rx,y:By+34,'text-anchor':'end'},s,nf(seg/1000,seg<10000?1:0)+' '+U().km);
  el('text',{x:(Lx+Rx)/2,y:By+34,'text-anchor':'middle'},s,D().speed);
  let d='';S.a.prof.forEach(([x,v],i)=>d+=(i?'L':'M')+sx(x).toFixed(1)+' '+sy(v).toFixed(1));
  el('path',{d:d+`L${Rx} ${By}L${Lx} ${By}Z`,style:`fill:${tok('--sky')};fill-opacity:.16`},s);
  el('path',{d,style:`fill:none;stroke:${tok('--sky')};stroke-width:5;stroke-linejoin:round`},s);
  if(xIn>=0){const v=interp(S.a.prof,xIn);el('line',{x1:sx(xIn),y1:Ty,x2:sx(xIn),y2:By,style:`stroke:${tok('--sun')};stroke-width:3`},s);el('use',{href:'#gem',x:sx(xIn)-14,y:sy(v)-14,width:28,height:28},s);}
}
const niceStep=(r,t)=>{const raw=r/t,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return(f<1.5?1:f<3?2:f<7?5:10)*p;};
function drawCum(){
  const s=$('cum');s.innerHTML='';const Lx=90,Rx=975,Ty=16,By=330,rows=S.rows,Y=S.Y;
  let lo=Math.min(...rows.map(r=>Math.min(r[1],r[2])))/1e6,hi=Math.max(0,...rows.map(r=>Math.max(r[1],r[2])))/1e6;if(hi-lo<1)hi+=1;
  const st=niceStep(hi-lo,5);lo=Math.floor(lo/st)*st;hi=Math.ceil(hi/st)*st;
  const sx=t=>Lx+(Rx-Lx)*t/Y,sy=v=>By-(By-Ty)*(v-lo)/(hi-lo);
  for(let v=lo;v<=hi+1e-9;v+=st){const z=Math.abs(v)<1e-9;el('line',{x1:Lx,y1:sy(v),x2:Rx,y2:sy(v),style:`stroke:${z?tok('--ink'):tok('--line')};stroke-width:${z?2.5:1.5}`},s);el('text',{x:Lx-12,y:sy(v)+7,'text-anchor':'end'},s,nf(v,st<1?1:0));}
  const xs=Y<=12?1:Y<=25?5:10;for(let t=0;t<Y;t+=xs)el('text',{x:sx(t),y:By+34,'text-anchor':t===0?'start':'middle'},s,t);
  el('text',{x:Rx,y:By+34,'text-anchor':'end'},s,Y+' '+U().yr);
  const line=(i,c)=>{let d='';rows.forEach((r,k)=>d+=(k?'L':'M')+sx(r[0]).toFixed(1)+' '+sy(r[i]/1e6).toFixed(1));
    el('path',{d,style:'fill:none;stroke:rgba(11,31,77,.22);stroke-width:9;stroke-linejoin:round;stroke-linecap:round',transform:'translate(2 5)'},s);
    el('path',{d,style:`fill:none;stroke:${c};stroke-width:6;stroke-linejoin:round;stroke-linecap:round`},s);
    const l=rows[rows.length-1];el('circle',{cx:sx(l[0]),cy:sy(l[i]/1e6),r:8,style:`fill:${c}`},s);};
  line(1,tok('--sky'));line(2,tok('--sun'));
  [S.pay,S.dpay].forEach(y=>{if(y!==null&&y<=Y)el('use',{href:'#gem',x:sx(y)-17,y:sy(0)-17,width:34,height:34},s);});
}
function drawSens(){
  const d=D(),u=U(),trf=[...new Set([20,35,50,Math.round(S.p.tariff),140])].sort((a,b)=>a-b),g=S.p.esc/100,r=S.p.disc/100;
  let h='<thead><tr><th>'+d.thT+'</th><th>'+d.thS+'</th><th>'+d.thP+'</th><th>'+d.thR(S.Y)+'</th></tr></thead><tbody>';
  trf.forEach(t=>{const sv=S.mwh*1000*t,pay=sv>0?S.prem/sv:null;let dd=-S.prem;for(let y=1;y<=S.Y;y++)dd+=sv*Math.pow(1+g,y-1)/Math.pow(1+r,y);
    const ok=dd>=0,mid=!ok&&pay!==null&&pay<=S.Y;
    h+='<tr'+(t===Math.round(S.p.tariff)?' class="cur"':'')+'><td>'+t+(t===140?' ('+d.pl+')':'')+'</td><td>'+nf(sv/1e6,1)+' '+u.mln+'</td><td>'+(pay===null?d.dash:fy(pay))+'</td><td>'+(dd>=0?'+':'')+nf(dd/1e6,0)+' '+u.mln+'<span class="pill '+(ok?'p-good':mid?'p-warn':'p-bad')+'">'+(ok?d.ok:mid?d.mid:d.nok)+'</span></td></tr>';});
  $('sens').innerHTML=h+'</tbody>';
}
let anim=null;
function play(){
  if(anim)cancelAnimationFrame(anim);
  const dur=matchMedia('(prefers-reduced-motion: reduce)').matches?1:7000,t0=performance.now(),total=S.L*1000,seg=S.seg,u=U();
  const step=now=>{const pr=Math.min((now-t0)/dur,1),Dd=pr*total,idx=Math.min(Math.floor(Dd/seg),S.n),xIn=Math.min(Dd-idx*seg,seg);
    $('cA').textContent=nf((idx*S.a.e+interp(S.a.cum,xIn))/3.6e6)+' '+u.kwh;$('cS').textContent=nf((idx*S.s.e+interp(S.s.cum,xIn))/3.6e6)+' '+u.kwh;
    drawRoute(pr);drawProfile(xIn);anim=pr<1?requestAnimationFrame(step):null;};
  anim=requestAnimationFrame(step);
}

/* ---------- запуск ---------- */
function all(){applyText();drawSpacing();if(S)render();}
setVals({...PRESETS.long,prem:400000,rate:116.66,years:30,esc:2,disc:8});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{L=b.dataset.lang;try{localStorage.setItem('esep-lang',L);}catch(e){}all();}));
$('preset').addEventListener('change',e=>{const p=PRESETS[e.target.value];if(p)setVals(p);compute();});
let tm=null;ids.forEach(i=>$(i).addEventListener('input',()=>{if(['len','stops','vmax','temp','regen','tariff','akm'].includes(i))$('preset').value='custom';clearTimeout(tm);tm=setTimeout(compute,60);}));
$('play').addEventListener('click',play);
const re=()=>{drawSpacing();if(S)render();};
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',re);
new MutationObserver(re).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
applyText();bands();coaches();drawSpacing();compute();ornament();
})();
</script>
